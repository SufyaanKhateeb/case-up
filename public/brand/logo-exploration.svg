<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830"><title>Sufyaan — logo exploration</title><desc>Three concepts: the existing shooting star, a sunglasses symbol, and sunglasses with the shooting star as a reflection. Exploratory mockups; the existing portfolio logo remains in use.</desc><rect width="1200" height="830" fill="#f8f9f2"/><g font-family="Arial, sans-serif" fill="#111210">
<text x="40" y="48" font-size="12" letter-spacing="2">SUFYAAN KHATEEB / LOGO EXPLORATION</text>
<text x="40" y="100" font-size="40" letter-spacing="-1.5">A personal mark. Three ways to wear it.</text>
<text x="40" y="131" font-size="16" fill="#686a63">Your shooting star stays at the heart of the identity. Sunglasses add the character’s personality.</text>
